<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>主题页 v2：事件、提醒与状态</title>
<link rel="stylesheet" href="topic-demo-v2.css">
</head>
<body>
<div class="canvas">
  <header class="demo-bar">
    <div class="demo-heading">
      <div class="demo-title">主题页 v2：事件、提醒与状态</div>
      <div class="demo-sub" id="stepNote">分配、上报、决策提案、待授权都会打印成事件消息；主题页只做列表和状态。</div>
    </div>
    <nav class="steps" id="stepNav" aria-label="演示步骤">
      <button data-step="0">总览</button>
      <button data-step="1" aria-selected="true">分配</button>
      <button data-step="2">上报</button>
      <button data-step="3">决策提案</button>
      <button data-step="4">待授权</button>
      <button data-step="5">归档</button>
    </nav>
    <div class="seg" id="viewSeg" role="group" aria-label="查看会话">
      <button data-view="main" class="on">主会话</button>
      <button data-view="topic">主题会话</button>
    </div>
  </header>

  <div class="stage">
    <div class="app" id="app" data-step="1">
      <main class="main">
        <header class="main-head">
          <div class="main-head-left">
            <div class="app-mark">C</div>
            <div>
              <div class="main-title" id="mainTitle">主会话</div>
              <div class="main-sub" id="mainSub">给我写一个五子棋的小游戏</div>
            </div>
          </div>
          <div class="main-actions">
            <div class="ghost-icon">↗</div>
            <div class="ghost-icon">⋯</div>
          </div>
        </header>

        <div class="sync-strip" id="syncStrip">
          <span class="sync-dot"></span>
          <span id="syncText"></span>
          <span class="now" id="syncNow"></span>
        </div>

        <div class="main-body" id="mainBody"></div>

        <div class="composer" id="composer">
          <div class="composer-line"><span class="composer-plus">+</span><span id="composerHint">继续输入，或按 / 选择操作…</span></div>
          <div class="composer-foot">
            <div class="tiny-actions"><span>Markdown</span><span>图片</span><span>文件</span></div>
            <div class="send">↑</div>
          </div>
        </div>
      </main>

      <aside class="sidebar">
        <div class="sidebar-head">
          <div>
            <div class="sidebar-eyebrow">Cowork</div>
            <div class="sidebar-title">侧边栏</div>
            <div class="sidebar-sub">工作区 · dsh-cowork</div>
          </div>
          <div class="sidebar-head-actions"><div class="new-topic">＋ 新主题</div></div>
        </div>

        <nav class="tabs">
          <div class="tab active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6.5h14M5 11h14M5 15.5h8" stroke-linecap="round"/><path d="M5.5 19.5 4 21v-3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            主题 <span class="tab-count" id="topicTabCount">6</span>
          </div>
          <div class="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="4.5" width="15" height="15" rx="3"/><path d="m8 12 2.5 2.5L16 9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            工作项 <span class="tab-count">3</span>
          </div>
          <div class="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4.5 12h3l2-5 4 10 2-5h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            活动记录
          </div>
          <div class="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4.5h12v15H6z"/><path d="M9 8h6M9 11.5h6M9 15h4" stroke-linecap="round"/></svg>
            项目记忆
          </div>
        </nav>

        <div class="sidebar-body" id="sidebarBody"></div>
      </aside>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const app = document.getElementById('app')
  const mainBody = document.getElementById('mainBody')
  const sidebarBody = document.getElementById('sidebarBody')
  const toast = document.getElementById('toast')
  const params = new URLSearchParams(location.search)

  const state = { step: 1, view: 'main', permission: 'pending', archived: false, archiveRecorded: false, menu: false }

  const notes = {
    0: '总览：事件、记录和状态的对应关系。主题列表只做导航，不展示决策记录。',
    1: '分配：主会话记录 1 条消息，主题会话 1 张提醒卡；列表新增一张运行中卡片。',
    2: '上报：2 个事件打印 2 条消息、2 张提醒卡。实时写入，不等待、不阻塞主题。',
    3: '决策提案：只生成并上报；主题页不展示记录，去工作项查看和提意见。',
    4: '待授权：主题移入阻塞并带标记。切到主题会话点允许或拒绝，列表会回到运行中。',
    5: '归档：主题卡的 ⋯ 菜单已展开，点“归档主题”。主会话只留一条消息，列表移入已解决；已解决卡片的菜单里可以恢复。'
  }

  const STATIC = {
    blocked: {
      title: '接入 GitHub 主页内容',
      cls: 'blocked',
      chips: [['red', '阻塞'], ['gray', '等待主会话']],
      digest: '与「个人网站结构讨论」范围重叠，等待主会话裁决。',
      time: '2 分钟前',
      work: 1
    },
    running: {
      title: '整理个人主页文案',
      cls: 'running',
      chips: [['blue', '运行中']],
      digest: '首版 Bio 已生成并上报，等待在工作项查看。',
      time: '8 分钟前',
      work: 2
    },
    idle: {
      title: '个人网站结构讨论',
      cls: 'idle',
      chips: [['gray', '空闲']],
      digest: '等待下一轮讨论，暂无阻塞。',
      time: '1 小时前',
      work: 1
    }
  }

  const EVENTS = [
    {
      type: 'assign', at: 1, time: '14:02', icon: '↓', label: '分配',
      main: { title: '已分配主题「五子棋小游戏」', sub: '把「做一个五子棋小游戏」交给主题会话。' },
      topic: { title: '主会话分配了这个需求', sub: '做一个五子棋小游戏，先出能玩的版本。' }
    },
    {
      type: 'report', at: 2, time: '14:05', icon: '↑', label: '上报',
      main: { title: '主题上报：初版棋盘完成', sub: '可以落子，棋盘 15×15。' },
      topic: { title: '已上报主会话：初版棋盘完成', sub: '可以落子，棋盘 15×15。' }
    },
    {
      type: 'report', at: 2, time: '14:09', icon: '↑', label: '上报',
      main: { title: '主题上报：等待确认棋盘尺寸', sub: '暂按 15×15，可以调整。' },
      topic: { title: '已上报主会话：等待确认棋盘尺寸', sub: '暂按 15×15，可以调整。' }
    },
    {
      type: 'proposal', at: 3, time: '14:12', icon: '◆', label: '决策提案',
      main: { title: '决策提案已生成并上报', sub: '评审请求挂到工作项详情。' },
      topic: { title: '决策提案已生成并上报主会话', sub: '评审请求挂到工作项详情。' }
    },
    {
      type: 'permission', at: 4, time: '14:18', icon: '!', label: '待授权',
      main: { title: '待授权：是否允许读取浏览器登录态', sub: '用于生成个人主页文案。' },
      topic: { title: '需要你确认：是否允许读取浏览器登录态', sub: '用于生成个人主页文案。' }
    },
    {
      type: 'archive', at: 5, time: '14:30', icon: '✓', label: '归档',
      main: { title: '五子棋小游戏 已归档', sub: '' },
      topic: null
    }
  ]

  function esc(text) {
    return String(text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  }

  function demoTopic() {
    if (state.step === 0) return null
    if (state.archived) {
      return {
        title: '五子棋小游戏', cls: 'resolved', chips: [['green', '已解决']],
        digest: '已归档 · 主会话已记录。', time: '刚刚', work: 3
      }
    }
    if (state.step >= 4 && state.permission === 'pending') {
      return {
        title: '五子棋小游戏', cls: 'blocked', chips: [['red', '阻塞'], ['amber', '待授权']],
        digest: '等待授权：是否允许读取浏览器登录态。', time: '6 分钟前', work: 3
      }
    }
    const digests = {
      1: '主会话已分配需求，主题会话开始执行。',
      2: '已上报 2 条：初版棋盘完成 / 等待确认尺寸。',
      3: '已生成决策提案并上报，等待在工作项查看。',
      4: state.permission === 'allowed'
        ? '授权已通过，主题继续执行。'
        : state.permission === 'denied'
          ? '授权被拒绝，主题改用你提供的内容继续。'
          : '归档时的待授权已失效，主题继续执行。'
    }
    const times = { 1: '刚刚', 2: '3 分钟前', 3: '5 分钟前', 4: '6 分钟前', 5: '6 分钟前' }
    return {
      title: '五子棋小游戏', cls: 'running', chips: [['blue', '运行中']],
      digest: digests[Math.min(state.step, 4)], time: times[state.step] || '刚刚', work: 3
    }
  }

  function cardHtml(card, isDemo = false) {
    const chips = card.chips.map(([kind, text]) => `<span class="chip ${kind}">${esc(text)}</span>`).join('')
    const more = isDemo
      ? '<button class="more more-button" data-card-menu="1" aria-label="主题菜单">⋯</button>'
      : '<span class="more">⋯</span>'
    const menu = isDemo && state.menu
      ? `<div class="card-menu" role="menu">
          <button data-menu="open">打开主题会话</button>
          ${state.archived
            ? '<button data-menu="restore" class="menu-restore">从归档中恢复</button>'
            : '<button data-menu="archive" class="menu-archive">归档主题</button>'}
        </div>`
      : ''
    return `<article class="topic-card ${card.cls}">
      <h3 class="topic-title">${esc(card.title)}</h3>
      <div class="chips">${chips}</div>
      <p class="digest">${esc(card.digest)}</p>
      <div class="topic-meta">
        <span class="topic-meta-left">${esc(card.time)}<span class="meta-dot"></span><span class="work-count">${card.work} 个工作项</span></span>
        ${more}
      </div>
      ${menu}
    </article>`
  }

  function renderSidebar() {
    const demo = demoTopic()
    const pending = state.step >= 4 && state.permission === 'pending' && !state.archived
    const blockedCards = [cardHtml(STATIC.blocked)]
    const runningCards = [cardHtml(STATIC.running)]
    if (demo !== null && demo.cls === 'blocked') blockedCards.unshift(cardHtml(demo, true))
    if (demo !== null && demo.cls === 'running') runningCards.unshift(cardHtml(demo, true))

    const restResolved = 3
    const resolvedTotal = restResolved + (demo !== null && demo.cls === 'resolved' ? 1 : 0)
    const resolvedCards = demo !== null && demo.cls === 'resolved' ? [cardHtml(demo, true)] : []
    const resolvedExtra = `<div class="resolved-row"><span class="resolved-icon">✓</span><span>已解决 ${restResolved} 个主题</span><span class="resolved-chevron">›</span></div>`

    const actionBar = pending
      ? `<div class="action-bar" id="actionBar">
          <div class="action-icon">!</div>
          <div class="action-text">
            <div class="action-title">需要你处理 1 项</div>
            <div class="action-sub">待授权 · 五子棋小游戏</div>
          </div>
          <div class="action-arrow">→</div>
        </div>`
      : ''

    const group = (label, cards, count, extra = '') => {
      if (cards.length === 0 && extra === '') return ''
      return `<section class="group">
        <div class="group-head"><span>${label}</span><span class="count">${count}</span></div>
        ${cards.join('')}${extra}
      </section>`
    }

    sidebarBody.innerHTML = actionBar
      + group('阻塞', blockedCards, blockedCards.length)
      + group('运行中', runningCards, runningCards.length)
      + group('空闲', [cardHtml(STATIC.idle)], 1)
      + group('已解决', resolvedCards, resolvedTotal, resolvedExtra)
      + `<div class="field-note"><b>字段：</b>主题名 / 生命周期 / 待授权 / 更新时间 / 摘要 / 工作项数。决策记录和审查状态不进入主题列表。</div>`

    document.getElementById('topicTabCount').textContent = String(6 + (state.step >= 1 ? 1 : 0))
  }

  function permissionAction(event) {
    if (state.permission === 'void') return '<span class="event-status off">已随归档失效</span>'
    if (state.view === 'main') {
      if (state.permission === 'pending') return '<span class="event-action" data-goto-topic="1">去主题会话处理</span>'
      return `<span class="event-status">${state.permission === 'allowed' ? '已允许' : '已拒绝'} · 刚刚</span>`
    }
    if (state.permission !== 'pending') return `<span class="event-status">${state.permission === 'allowed' ? '已允许' : '已拒绝'} · 刚刚</span>`
    return ''
  }

  function permissionButtons() {
    if (state.view !== 'topic' || state.step < 4 || state.archived || state.permission !== 'pending') return ''
    return `<div class="perm-actions">
      <button class="mini-primary" data-perm="allowed">允许</button>
      <button class="mini-ghost" data-perm="denied">拒绝</button>
    </div>`
  }

  function eventHtml(event, index) {
    const content = event[state.view]
    if (content === null || content === undefined) return ''
    if (event.type === 'archive') {
      return `<div class="system-line"><span class="ok">✓</span><span>${esc(event.time)} · 五子棋小游戏 已归档</span></div>`
    }
    const action = event.type === 'proposal'
      ? '<span class="event-action" data-toast="打开工作项查看提案（演示）">去工作项查看</span>'
      : event.type === 'permission' ? permissionAction(event) : ''
    const sync = state.view === 'main'
      ? `<span class="event-index">事件 ${index} · 已写入主会话记录</span>`
      : `<span class="event-index">事件 ${index}</span><span class="event-sync">✓ 已同步主会话</span>`
    const buttons = event.type === 'permission' ? permissionButtons() : ''
    return `<article class="event-card ${event.type}" id="event-${event.type}">
      <div class="event-icon ${event.type}">${event.icon}</div>
      <div class="event-body">
        <div class="event-top">
          <span class="event-label ${event.type}">${event.label}</span>
          <span class="event-time">${esc(event.time)}</span>
        </div>
        <div class="event-title">${esc(content.title)}</div>
        <div class="event-sub">${esc(content.sub)}</div>
        <div class="event-foot">${sync}${action || ''}</div>
        ${buttons}
      </div>
    </article>`
  }

  function overviewHtml() {
    return `<div class="overview">
      <h2>主题状态与记录规则</h2>
      <p class="lead">分配、上报、决策提案、待授权都是事件：发生即写入，1 个事件对应 1 条主会话消息和 1 张主题会话提醒卡。上报不等待主会话处理，主题继续执行。</p>
      <div class="rule-strip">
        <b>事件 : 消息 = 1 : 1</b>
        <span class="sep">·</span><span>实时写入</span>
        <span class="sep">·</span><span>不阻塞主题</span>
        <span class="sep">·</span><span>同一事件只打印一次</span>
      </div>

      <div class="ov-h">事件落在哪里</div>
      <table class="ov-table">
        <thead><tr><th>事件</th><th>主会话记录</th><th>主题会话提醒</th><th>主题列表</th><th>主题状态</th></tr></thead>
        <tbody>
          <tr><td>分配</td><td>1 条消息</td><td>1 张提醒卡</td><td>新建卡片</td><td>— → 运行中</td></tr>
          <tr><td>上报</td><td>每事件 1 条</td><td>每事件 1 张</td><td>摘要更新</td><td>不变</td></tr>
          <tr><td>决策提案</td><td>1 条</td><td>1 张</td><td>摘要更新</td><td>不变</td></tr>
          <tr><td>待授权</td><td>1 条</td><td>1 张</td><td>移入阻塞 + 标记</td><td>运行中/空闲 → 阻塞</td></tr>
          <tr><td>归档</td><td>1 条</td><td>无</td><td>移入已解决</td><td>→ 已解决</td></tr>
        </tbody>
      </table>

      <div class="ov-h">状态怎么变</div>
      <table class="ov-table">
        <thead><tr><th>现在</th><th>事件</th><th>之后</th></tr></thead>
        <tbody>
          <tr><td>—</td><td>主会话分配</td><td>运行中</td></tr>
          <tr><td>运行中</td><td>1 天没有活动</td><td>空闲</td></tr>
          <tr><td>空闲</td><td>新活动</td><td>运行中</td></tr>
          <tr><td>运行中 / 空闲</td><td>待授权、跨主题冲突、交接阻塞</td><td>阻塞</td></tr>
          <tr><td>阻塞</td><td>问题处理完</td><td>回到阻塞前的状态</td></tr>
          <tr><td>运行中 / 阻塞 / 空闲</td><td>归档</td><td>已解决</td></tr>
          <tr><td>已解决</td><td>用户重新打开</td><td>运行中</td></tr>
        </tbody>
      </table>

      <p class="ov-note"><b>决策记录：</b>只在主题会话生成并上报；主题页不展示记录，也不展示审查状态。查看和提意见在工作项，资料进 Artifact 工作室，这两处不在本设计内。</p>
      <p class="ov-note"><b>需要你处理：</b>只统计待授权，是入口不是队列。分配、上报、提案的提醒在会话记录里，不在主题页复制。</p>
      <p class="ov-note"><b>待授权：</b>是标记不是分组。标记出现时主题在阻塞组；处理完回到阻塞前的状态。</p>
      <p class="ov-note"><b>归档入口：</b>在主题卡的 ⋯ 菜单里，菜单里另有“从归档中恢复”。归档后主会话只留一条消息。</p>
    </div>`
  }

  function renderMain() {
    const visible = EVENTS.filter((event) => event.at <= state.step && (event.type !== 'archive' || state.archiveRecorded))
    const inTopic = state.view === 'topic'
    const archived = state.archived

    document.getElementById('mainTitle').textContent = state.step === 0 ? '总览' : inTopic ? '主题会话' : '主会话'
    document.getElementById('mainSub').textContent = state.step === 0 ? '主题状态与记录规则' : inTopic ? '五子棋小游戏' : '给我写一个五子棋的小游戏'
    document.getElementById('composerHint').textContent = inTopic && archived ? '主题已归档，会话只读' : '继续输入，或按 / 选择操作…'

    const sync = document.getElementById('syncStrip')
    sync.style.display = state.step === 0 ? 'none' : ''
    document.getElementById('syncText').textContent = inTopic
      ? `事件 ${visible.filter((event) => event.type !== 'archive').length} · 提醒卡 ${visible.filter((event) => event.type !== 'archive').length} · 已同步主会话`
      : `事件 ${visible.length} · 消息 ${visible.length} · 实时写入，不阻塞`
    const last = visible.filter((event) => !(inTopic && event.type === 'archive')).slice(-1)[0]
    document.getElementById('syncNow').textContent = last ? `最近写入 ${last.time}` : ''

    if (state.step === 0) {
      mainBody.innerHTML = overviewHtml()
      mainBody.scrollTop = 0
      return
    }

    if (!inTopic) {
      const cards = visible.map((event, index) => eventHtml(event, EVENTS.indexOf(event) + 1)).join('')
      mainBody.innerHTML = `
        <div class="day-label">今天</div>
        <div class="row user"><div class="bubble">给我写一个五子棋的小游戏</div><div class="avatar">我</div></div>
        <div class="row"><div class="avatar assistant">A</div><div class="bubble">可以。我先确认棋盘尺寸和胜负规则，再拆成可运行的页面。</div></div>
        ${cards}`
    } else {
      const banner = archived
        ? '<div class="archived-banner"><b>主题已归档。</b>会话转为只读；归档消息只在主会话记录里。</div>'
        : ''
      const rest = visible
        .filter((event) => event.type !== 'archive' && event.type !== 'assign')
        .map((event) => eventHtml(event, EVENTS.indexOf(event) + 1))
        .join('')
      mainBody.innerHTML = `
        ${banner}
        ${eventHtml(EVENTS[0], 1)}
        <div class="row user"><div class="bubble">做一个五子棋小游戏，先出能玩的版本。</div><div class="avatar">我</div></div>
        <div class="row"><div class="avatar assistant">A</div><div class="bubble">棋盘 15×15，五子连珠胜。先拆成棋盘、落子、胜负判断三块。</div></div>
        <div class="step-line">已写入 3 个文件 · index.html / board.js / style.css</div>
        ${rest}`
    }
    // An archived topic opens at the banner; the record can scroll from there.
    mainBody.scrollTop = inTopic && archived ? 0 : mainBody.scrollHeight
  }

  function render() {
    app.dataset.step = String(state.step)
    renderSidebar()
    renderMain()
    document.querySelectorAll('#stepNav button').forEach((button) => {
      button.setAttribute('aria-selected', button.dataset.step === String(state.step) ? 'true' : 'false')
    })
    document.querySelectorAll('#viewSeg button').forEach((button) => {
      button.classList.toggle('on', button.dataset.view === state.view)
      button.disabled = state.step === 0
    })
    document.getElementById('stepNote').textContent = notes[state.step]
    document.getElementById('syncStrip').style.display = state.step === 0 ? 'none' : ''
  }

  function setStep(step) {
    state.step = step
    state.archived = false
    state.archiveRecorded = false
    state.menu = step === 5
    if (step < 4 || state.permission === 'void') state.permission = 'pending'
    if (step === 0) state.view = 'main'
    render()
  }

  function showToast(text) {
    toast.textContent = text
    toast.classList.add('on')
    clearTimeout(toast.timer)
    toast.timer = setTimeout(() => toast.classList.remove('on'), 2200)
  }

  function archiveTopic() {
    state.archived = true
    state.archiveRecorded = true
    state.menu = true
    if (state.permission === 'pending') state.permission = 'void'
    render()
    showToast('已归档：主会话只留一条消息，列表移入已解决')
  }

  function restoreTopic() {
    state.archived = false
    state.menu = false
    render()
    showToast('已从归档恢复：列表回到运行中，归档记录留在主会话')
  }

  function setView(view) {
    if (state.step === 0) return
    state.view = view
    render()
  }

  document.querySelectorAll('#stepNav button').forEach((button) => {
    button.addEventListener('click', () => setStep(Number(button.dataset.step)))
  })
  document.querySelectorAll('#viewSeg button').forEach((button) => {
    button.addEventListener('click', () => setView(button.dataset.view))
  })

  function focusPermission() {
    state.view = 'topic'
    render()
    const card = document.querySelector('#event-permission')
    if (card) {
      card.scrollIntoView({ block: 'center' })
      card.classList.add('flash')
    }
  }

  document.addEventListener('click', (event) => {
    const toastTarget = event.target.closest('[data-toast]')
    if (toastTarget) {
      showToast(toastTarget.dataset.toast)
      return
    }
    if (event.target.closest('[data-card-menu]')) {
      state.menu = !state.menu
      render()
      return
    }
    const menuItem = event.target.closest('[data-menu]')
    if (menuItem) {
      const action = menuItem.dataset.menu
      if (action === 'open') {
        state.view = 'topic'
        state.menu = false
        render()
      } else if (action === 'archive') {
        archiveTopic()
      } else if (action === 'restore') {
        restoreTopic()
      }
      return
    }
    if (event.target.closest('#actionBar')) {
      focusPermission()
      return
    }
    const perm = event.target.closest('[data-perm]')
    if (perm) {
      state.permission = perm.dataset.perm
      render()
      showToast(state.permission === 'allowed'
        ? '已允许：列表回到运行中，主会话记录不新增消息'
        : '已拒绝：主题改用你提供的内容，列表回到运行中')
      return
    }
    if (event.target.closest('[data-goto-topic]')) focusPermission()
  })

  if (params.get('shot') === '1') document.body.classList.add('shot')
  const step = Number(params.get('step'))
  const view = params.get('view') === 'topic' ? 'topic' : 'main'
  state.step = Number.isInteger(step) && step >= 0 && step <= 5 ? step : 1
  state.view = state.step === 0 ? 'main' : view
  if (params.get('permission') === 'allowed' || params.get('permission') === 'denied') {
    state.permission = params.get('permission')
  }
  const archiveParam = params.get('archived') === '1'
  if (archiveParam) {
    state.archived = true
    state.archiveRecorded = true
    state.menu = true
    if (state.permission === 'pending') state.permission = 'void'
  } else {
    state.menu = state.step === 5
  }
  render()
  // Demo controls for deterministic screenshots: ?action=archive / ?action=restore.
  const action = params.get('action')
  if (action === 'archive') archiveTopic()
  else if (action === 'restore') {
    archiveTopic()
    restoreTopic()
  }
})()
</script>
</body>
</html>
