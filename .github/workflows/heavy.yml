name: Heavy

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base ref to compare against
        required: false
        default: main
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: heavy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  heavy-gate:
    name: heavy-gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'run-heavy'
    runs-on: [self-hosted, heavy]
    timeout-minutes: 60
    steps:
      - name: Checkout PR head or selected ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base
        run: >-
          git fetch --no-tags origin
          "${{ github.event.pull_request.base.ref || inputs.base }}"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Host smoke
        run: DSH_HOST_SMOKE_STRICT=1 npm run test:host-smoke

      - name: Browser and layered coverage
        run: >-
          npm run test:coverage:layered --
          --base "origin/${{ github.event.pull_request.base.ref || inputs.base }}"

      - name: Upload coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heavy-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
