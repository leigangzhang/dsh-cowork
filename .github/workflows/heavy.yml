name: Heavy

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base ref or SHA; empty resolves the merge base with origin/main
        required: false
        default: ''
      repo_path:
        description: Local checkout path on the heavy runner
        required: false
        default: /Users/ray/Workspace/dsh-cowork
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - 'agent/**'
  pull_request_target:
    types: [labeled]
    branches: [main]

permissions:
  contents: read
  statuses: write
  checks: write

concurrency:
  group: heavy-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  heavy-gate:
    name: heavy-gate
    # Automatic runs are limited to same-repository pull-request heads. Fork
    # heads keep the event but skip the job, so they never reach this runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
       github.event.label.name == 'heavy' &&
       github.event.pull_request.state == 'open' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, heavy]
    timeout-minutes: 60
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      npm_config_registry: https://registry.npmjs.org
    steps:
      - name: Refresh source branch refs
        id: source
        env:
          LOCAL_REPO: ${{ inputs.repo_path || '/Users/ray/Workspace/dsh-cowork' }}
        run: |
          test -d "$LOCAL_REPO/.git" || {
            echo "::error::local repository not found at $LOCAL_REPO"
            exit 1
          }
          git -C "$LOCAL_REPO" fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          echo "main=$(git -C "$LOCAL_REPO" rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"

      - name: Checkout selected ref from the local repository
        env:
          LOCAL_REPO: ${{ inputs.repo_path || '/Users/ray/Workspace/dsh-cowork' }}
        run: |
          test -d "$LOCAL_REPO/.git" || {
            echo "::error::local repository not found at $LOCAL_REPO"
            exit 1
          }
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git clone --no-hardlinks --no-checkout "$LOCAL_REPO" .
          git checkout --detach "$HEAD_SHA"

      - name: Resolve base
        id: base
        env:
          LOCAL_REPO: ${{ inputs.repo_path || '/Users/ray/Workspace/dsh-cowork' }}
          BASE_INPUT: ${{ inputs.base }}
          TRUSTED_MAIN: ${{ steps.source.outputs.main }}
        run: |
          if [ -n "$BASE_INPUT" ]; then
            if [[ "$BASE_INPUT" =~ ^[0-9a-f]{7,40}$ ]] && git -C "$LOCAL_REPO" cat-file -e "${BASE_INPUT}^{commit}" 2>/dev/null; then
              sha="$(git -C "$LOCAL_REPO" rev-parse "${BASE_INPUT}^{commit}")"
            else
              git -C "$LOCAL_REPO" fetch --no-tags origin "$BASE_INPUT"
              sha="$(git -C "$LOCAL_REPO" rev-parse FETCH_HEAD)"
            fi
          else
            sha="$(git -C "$LOCAL_REPO" merge-base "$TRUSTED_MAIN" "$HEAD_SHA")"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Prepare trusted source
        env:
          LOCAL_REPO: ${{ inputs.repo_path || '/Users/ray/Workspace/dsh-cowork' }}
        run: |
          TRUSTED_ROOT="$RUNNER_TEMP/heavy-trusted"
          rm -rf "$TRUSTED_ROOT"
          mkdir -p "$TRUSTED_ROOT"
          trusted_sha="$(git -C "$LOCAL_REPO" rev-parse refs/remotes/origin/main)"
          echo "trusted_sha=$trusted_sha"
          git -C "$LOCAL_REPO" archive --format=tar "$trusted_sha" | tar -x -C "$TRUSTED_ROOT"
          test -f "$TRUSTED_ROOT/scripts/ci/publish-heavy.mjs" || {
            echo "::error::trusted publisher source is missing"
            exit 1
          }

      - name: Classify changed paths
        id: classify
        run: |
          cd "$GITHUB_WORKSPACE"
          node "$RUNNER_TEMP/heavy-trusted/scripts/ci/classify-change.mjs" \
            --base "${{ steps.base.outputs.sha }}" \
            --github-output

      - name: Configure git defaults for temporary test repositories
        if: steps.classify.outputs.docs_only != 'true'
        run: git config --global init.defaultBranch main

      - name: Verify the runner Node version
        if: steps.classify.outputs.docs_only != 'true'
        run: test "$(node --version)" = "v$(cat .node-version)"

      - name: Initialize command results
        if: steps.classify.outputs.docs_only != 'true'
        run: |
          : > "$RUNNER_TEMP/heavy-commands.jsonl"

      - name: Record pre-run artifact identity
        if: steps.classify.outputs.docs_only != 'true'
        run: >-
          node "$RUNNER_TEMP/heavy-trusted/scripts/review/gate-artifact.mjs"
          --base "${{ steps.base.outputs.sha }}"
          --head "$HEAD_SHA"
          > "$RUNNER_TEMP/heavy-artifact.before.json"

      - name: Configure npm cache
        if: steps.classify.outputs.docs_only != 'true'
        run: |
          cache_dir="$HOME/.cache/dsh-cowork/npm"
          cache_limit_kb=2097152
          mkdir -p "$cache_dir"
          cache_kb="$(du -sk "$cache_dir" | awk '{print $1}')"
          if [ "$cache_kb" -gt "$cache_limit_kb" ]; then
            echo "npm cache is ${cache_kb}KB; clearing it before install"
            npm cache clean --force --cache "$cache_dir"
          fi
          echo "npm_config_cache=$cache_dir" >> "$GITHUB_ENV"
          echo "npm cache: $cache_dir"

      - name: Verify npm configuration
        if: steps.classify.outputs.docs_only != 'true'
        run: |
          registry="$(npm config get registry)"
          test "${registry%/}" = "https://registry.npmjs.org"
          test "$(npm config get cache)" = "$HOME/.cache/dsh-cowork/npm"

      - name: Install dependencies
        if: steps.classify.outputs.docs_only != 'true'
        continue-on-error: true
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Chromium
        if: steps.classify.outputs.docs_only != 'true'
        continue-on-error: true
        run: npx playwright install chromium

      - name: Typecheck
        if: steps.classify.outputs.docs_only != 'true'
        continue-on-error: true
        run: |
          set +e
          npm run typecheck
          code=$?
          printf '{"name":"typecheck","exitCode":%d}\n' "$code" >> "$RUNNER_TEMP/heavy-commands.jsonl"
          exit "$code"

      - name: Build
        if: steps.classify.outputs.docs_only != 'true'
        continue-on-error: true
        run: |
          set +e
          npm run build
          code=$?
          printf '{"name":"build","exitCode":%d}\n' "$code" >> "$RUNNER_TEMP/heavy-commands.jsonl"
          exit "$code"

      - name: Host smoke
        if: steps.classify.outputs.docs_only != 'true'
        continue-on-error: true
        env:
          DSH_HOST_SMOKE_STRICT: "1"
        run: |
          set +e
          npm run test:host-smoke
          code=$?
          printf '{"name":"host-smoke","exitCode":%d}\n' "$code" >> "$RUNNER_TEMP/heavy-commands.jsonl"
          exit "$code"

      - name: Browser and layered coverage
        if: steps.classify.outputs.docs_only != 'true'
        continue-on-error: true
        run: |
          set +e
          npm run test:coverage:layered -- --base "${{ steps.base.outputs.sha }}"
          code=$?
          printf '{"name":"coverage-layered","exitCode":%d}\n' "$code" >> "$RUNNER_TEMP/heavy-commands.jsonl"
          exit "$code"

      - name: Coverage gap report (observational)
        if: steps.classify.outputs.docs_only != 'true'
        continue-on-error: true
        run: |
          set +e
          npm run coverage:gaps -- --base "${{ steps.base.outputs.sha }}" > "$RUNNER_TEMP/coverage-gaps.txt" 2>&1
          code=$?
          printf '{"name":"coverage-gaps","exitCode":%d}\n' "$code" >> "$RUNNER_TEMP/heavy-commands.jsonl"
          cat "$RUNNER_TEMP/coverage-gaps.txt" || true
          exit "$code"

      - name: Versioned keyless E2E
        if: steps.classify.outputs.docs_only != 'true'
        continue-on-error: true
        run: |
          set +e
          npm run test:e2e
          code=$?
          printf '{"name":"e2e-keyless","exitCode":%d}\n' "$code" >> "$RUNNER_TEMP/heavy-commands.jsonl"
          exit "$code"

      - name: Versioned host-bash E2E (observational)
        if: steps.classify.outputs.docs_only != 'true'
        continue-on-error: true
        run: |
          set +e
          npm run test:e2e:bash
          code=$?
          printf '{"name":"e2e-bash","exitCode":%d}\n' "$code" >> "$RUNNER_TEMP/heavy-commands.jsonl"
          exit "$code"

      - name: Publish heavy result
        if: ${{ always() && steps.classify.outputs.docs_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAVY_BASE_REF: ${{ steps.base.outputs.sha }}
          HEAVY_WORKSPACE: ${{ github.workspace }}
          HEAVY_COMMANDS_FILE: ${{ runner.temp }}/heavy-commands.jsonl
          HEAVY_BEFORE_ARTIFACT: ${{ runner.temp }}/heavy-artifact.before.json
          HEAVY_GAP_REPORT: ${{ runner.temp }}/coverage-gaps.txt
          HEAVY_RESULT_PATH: ${{ github.workspace }}/heavy-result.json
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node "$RUNNER_TEMP/heavy-trusted/scripts/ci/publish-heavy.mjs"

      - name: Show coverage evidence
        if: ${{ always() && steps.classify.outputs.docs_only != 'true' }}
        run: |
          if [ -f coverage/layered.json ]; then
            ls -lh coverage/layered.json coverage/client.json coverage/browser.lcov
          else
            echo "coverage report was not produced"
          fi
          if [ -f heavy-result.json ]; then
            echo "heavy result:"
            cat heavy-result.json
          else
            echo "heavy-result.json was not produced"
          fi
