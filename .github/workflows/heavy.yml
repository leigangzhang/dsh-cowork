name: Heavy

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base ref to compare against
        required: false
        default: main
      repo_path:
        description: Local checkout path on the heavy runner
        required: false
        default: /Users/ray/Workspace/dsh-cowork

permissions:
  contents: read

concurrency:
  group: heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heavy-gate:
    name: heavy-gate
    # Only a write-capable maintainer can start this workflow. No PR event
    # reaches the self-hosted runner until a head-bound check publisher exists.
    runs-on: [self-hosted, heavy]
    timeout-minutes: 60
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Checkout selected ref from the local repository
        env:
          LOCAL_REPO: ${{ inputs.repo_path }}
        run: |
          test -d "$LOCAL_REPO/.git" || {
            echo "::error::local repository not found at $LOCAL_REPO"
            exit 1
          }
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git clone --no-hardlinks --no-checkout "$LOCAL_REPO" .
          git checkout --detach "$GITHUB_SHA"

      - name: Fetch base
        run: git fetch --no-tags origin "${{ inputs.base }}"

      - name: Configure git defaults for temporary test repositories
        run: git config --global init.defaultBranch main

      - name: Verify the runner Node version
        run: test "$(node --version)" = "v$(cat .node-version)"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Host smoke
        run: DSH_HOST_SMOKE_STRICT=1 npm run test:host-smoke

      - name: Browser and layered coverage
        run: >-
          npm run test:coverage:layered --
          --base "origin/${{ inputs.base }}"

      - name: Show coverage evidence
        if: ${{ always() }}
        run: |
          if [ -f coverage/layered.json ]; then
            ls -lh coverage/layered.json coverage/client.json coverage/browser.lcov
          else
            echo "coverage report was not produced"
          fi
