name: Heavy Comment

on:
  workflow_run:
    workflows: [Heavy]
    types: [completed]

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: write

concurrency:
  group: heavy-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  publish:
    name: heavy-comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Publish heavy summary
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAVY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAVY_RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: node scripts/ci/publish-heavy-comment.mjs
