name: Heavy Comment

on:
  workflow_run:
    workflows: [Heavy]
    types: [completed]

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: write
  actions: write

concurrency:
  group: heavy-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  publish:
    name: heavy-comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Resolve pull request
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          HEAVY_RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          HEAVY_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAVY_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: node scripts/ci/resolve-heavy-pr.mjs --github-output

      - name: Publish heavy summary
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          HEAD_SHA: ${{ steps.pull.outputs.head }}
          HEAVY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAVY_RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMBER: ${{ steps.pull.outputs.number }}
        run: node scripts/ci/publish-heavy-comment.mjs

      - name: Trigger derived gate
        if: ${{ always() && steps.pull.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gate-artifact-v2.yml --ref main -f pr_number="${{ steps.pull.outputs.number }}"
