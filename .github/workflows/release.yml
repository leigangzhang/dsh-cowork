name: Publish plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DSH_COWORK_SOURCEMAP: '0'

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check repository conventions
        run: npm run check

      - name: Check publish artifact
        run: npm run pack:check

      - name: Verify tag matches package version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match package version $VERSION"
            exit 1
          fi

      - name: Pack release tarball
        run: npm pack --ignore-scripts

      - name: Publish to npm
        run: npm publish --access public --provenance --ignore-scripts

      - name: Attach tarball to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./dsh-external-dsh-cowork-*.tgz \
            --title "$GITHUB_REF_NAME" \
            --notes "dsh-cowork $GITHUB_REF_NAME"
