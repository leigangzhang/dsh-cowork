name: Policy V2

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [CI, Pre-Merge]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: write

concurrency:
  group: policy-gate-v2-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  policy-gate:
    name: policy-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Resolve pull request event
        id: event
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="${EVENT_PR_NUMBER:-$WORKFLOW_RUN_PR_NUMBER}"
          if [ -z "$pr_number" ] && [ -n "$WORKFLOW_RUN_HEAD_SHA" ]; then
            pr_number="$(gh api "repos/$GITHUB_REPOSITORY/commits/$WORKFLOW_RUN_HEAD_SHA/pulls?per_page=100" \
              --jq '[.[] | select(.state == "open")] | if length == 1 then .[0].number else empty end')"
          fi
          if [ -z "$pr_number" ]; then
            echo "::error::could not resolve one open pull request for this gate run; fork PRs may require a same-repository branch"
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      # The required gate is the commit status written with the job token. This
      # App token is only for the non-required display check, whose job-token
      # check run can be omitted from the pull-request merge box.
      - name: Create gate display check token
        id: gate-token
        if: ${{ vars.GATE_APP_CLIENT_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Publish derived gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_CHECK_TOKEN: ${{ steps.gate-token.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.event.outputs.pr_number }}
          POLICY_MODE: ${{ vars.MERGE_POLICY_MODE || 'report' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/publish-gate.mjs
