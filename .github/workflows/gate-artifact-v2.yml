name: Policy V2

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [CI, Pre-Merge]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: policy-gate-v2-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  policy-gate:
    name: policy-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Resolve pull request event
        id: event
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          pr_number="${EVENT_PR_NUMBER:-$WORKFLOW_RUN_PR_NUMBER}"
          if [ -z "$pr_number" ]; then
            echo "::error::could not resolve the pull request for this gate run"
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Publish derived gate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.event.outputs.pr_number }}
          POLICY_MODE: ${{ vars.MERGE_POLICY_MODE || 'report' }}
          GATE_CHECK_NAME: ${{ vars.MERGE_POLICY_MODE == 'block' && 'gate-artifact' || 'gate-artifact-v2' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/publish-gate.mjs
