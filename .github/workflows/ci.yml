name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Classify changed paths
        id: classify
        run: >-
          node scripts/ci/classify-change.mjs
          --base "origin/${{ github.base_ref }}"
          --github-output

  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run conventions
        run: npm run check

  unit:
    name: unit
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Temporary repositories created by the tests make commits; hosted runners
      # have no global git identity.
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Configure git defaults for temporary test repositories
        run: git config --global init.defaultBranch main

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage gate
        run: npm run test:coverage

  code-health:
    name: code-health
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compare against the merge base rather than the base branch tip: the PR
      # changeset is what this gate judges, and a branch that is behind main
      # must not audit main's own commits as part of the pull request.
      - name: Resolve the compared base
        id: base
        run: echo "sha=$(git merge-base "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}")" >> "$GITHUB_OUTPUT"

      - name: Audit changed files
        run: >-
          npm run --silent fallow:audit --
          --base "${{ steps.base.outputs.sha }}"
          --format json > "$RUNNER_TEMP/fallow-audit.json"

      # The exit code is a coarse aggregate; assert the attribution counters
      # explicitly and bind the report to the compared commits and the pinned
      # CLI version, which the exit code alone cannot prove.
      - name: Require zero introduced and worsened complexity
        run: >-
          node scripts/ci/fallow-gate.mjs
          --audit "$RUNNER_TEMP/fallow-audit.json"
          --expect-base "${{ steps.base.outputs.sha }}"
          --expect-head "${{ github.event.pull_request.head.sha }}"

      - name: Health baseline gate
        run: npm run fallow:health

  pr-gate:
    name: pr-gate
    needs: [classify, docs-check, unit, code-health]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require classification
        if: ${{ needs.classify.result != 'success' }}
        run: |
          echo "::error::classification did not succeed"
          exit 1

      - name: Require documentation conventions
        if: ${{ needs.docs-check.result != 'success' }}
        run: |
          echo "::error::docs-check did not succeed"
          exit 1

      - name: Require source lane for source changes
        if: ${{ needs.classify.outputs.docs_only != 'true' && needs.unit.result != 'success' }}
        run: |
          echo "::error::unit did not succeed for a source change"
          exit 1

      - name: Reject unexpected source lane on docs-only changes
        if: ${{ needs.classify.outputs.docs_only == 'true' && needs.unit.result != 'skipped' }}
        run: |
          echo "::error::unit ran or failed although the change was classified as docs-only"
          exit 1

      - name: Require code health for source changes
        if: ${{ needs.classify.outputs.docs_only != 'true' && needs.code-health.result != 'success' }}
        run: |
          echo "::error::code-health did not succeed for a source change"
          exit 1

      - name: Reject unexpected code health lane on docs-only changes
        if: ${{ needs.classify.outputs.docs_only == 'true' && needs.code-health.result != 'skipped' }}
        run: |
          echo "::error::code-health ran or failed although the change was classified as docs-only"
          exit 1

      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      # typecheck/build require a DSH source checkout and the installed app's
      # runtime packages; they run in the local heavy lane, not on a hosted runner.
      - name: Write review context
        run: >-
          node scripts/review/gate-artifact.mjs
          --base "origin/${{ github.base_ref }}"
          --head "${{ github.event.pull_request.head.sha }}"
          > review-context.json

      - name: Upload review context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-context
          path: review-context.json
          if-no-files-found: error
          retention-days: 14
